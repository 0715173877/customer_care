<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Customer Care Automation{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-widget-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-8">
                    <h1 class="text-xl font-bold">🤖 Customer Care</h1>
                    <div class="flex space-x-4">
                        <a href="{% url 'payments:dashboard' %}" class="hover:bg-blue-700 px-3 py-2 rounded {% if request.resolver_match.app_name == 'payments' %}bg-blue-700{% endif %}">
                            💳 Payments
                        </a>
                        <a href="{% url 'calls:dashboard' %}" class="hover:bg-blue-700 px-3 py-2 rounded {% if request.resolver_match.app_name == 'calls' %}bg-blue-700{% endif %}">
                            📞 Calls
                        </a>
                        <a href="{% url 'sms_app:dashboard' %}" class="hover:bg-blue-700 px-3 py-2 rounded {% if request.resolver_match.app_name == 'sms_app' %}bg-blue-700{% endif %}">
                            💬 SMS
                        </a>
                        <a href="{% url 'chatbot:dashboard' %}" class="hover:bg-blue-700 px-3 py-2 rounded {% if request.resolver_match.app_name == 'chatbot' %}bg-blue-700{% endif %}">
                            🤖 Chatbot
                        </a>
                        <a href="{% url 'admin:index' %}" class="hover:bg-blue-700 px-3 py-2 rounded">
                            ⚙️ Admin
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                    <span class="text-sm text-blue-200">
                        👤 {{ user.username }}
                    </span>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="hover:bg-blue-700 px-3 py-2 rounded text-sm">
                            🚪 Logout
                        </button>
                    </form>
                    {% else %}
                    <a href="{% url 'login' %}?next={{ request.path }}" class="hover:bg-blue-700 px-3 py-2 rounded text-sm">
                        🔐 Login
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
